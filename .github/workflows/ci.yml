name: CI

on:
  push:
    branches: [ main, feature_2 ]
  pull_request:
    branches: [ main, feature_2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: LMS-sys.settings
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is up"; break; fi; echo "Waiting for Postgres..."; sleep 2; done

      - name: Django check and migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lms
        run: |
          python manage.py collectstatic --noinput || true
          python manage.py migrate --noinput
          python manage.py check --deploy --fail-level WARNING || true

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lms
        run: |
          python manage.py test --verbosity=2

  deploy:
    name: Deploy to Server
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature_2'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # HARDCODED PATH FOR FINAL DEBUGGING
            PROJECT_DIR="/home/ubuntu/LMS-sys"

            echo "Deployment script started."
            echo "--> Attempting to deploy to: $PROJECT_DIR"

            # Verify the path exists
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "--> ERROR: Hardcoded directory '$PROJECT_DIR' does NOT exist on the server."
              echo "--> This is the final check. The path is definitively incorrect."
              echo "--> Listing contents of /home/ubuntu/ to find the correct project folder:"
              ls -la /home/ubuntu/
              exit 1
            fi

            cd "$PROJECT_DIR"
            echo "--> Successfully changed directory to:"
            pwd

            echo "--> Fetching latest code..."
            git fetch origin
            git checkout ${{ github.sha }}

            echo "--> Installing dependencies..."
            # Using the python/pip from a virtual environment if it exists
            if [ -f "venv/bin/pip" ]; then
              venv/bin/pip install -r requirements.txt
            else
              pip install -r requirements.txt
            fi

            echo "--> Running database migrations..."
            if [ -f "venv/bin/python" ]; then
              venv/bin/python manage.py migrate --noinput
              venv/bin/python manage.py collectstatic --noinput
            else
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput
            fi

            echo "--> Restarting services..."
            sudo systemctl restart gunicorn || true
            sudo systemctl restart nginx || true

            echo "--> DEPLOYMENT COMPLETED SUCCESSFULLY!"