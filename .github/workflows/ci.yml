name: CI

on:
  push:
    branches: [ main, feature_2 ]
  pull_request:
    branches: [ main, feature_2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: LMS-sys.settings
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "Postgres is up"; break; fi; echo "Waiting for Postgres..."; sleep 2; done

      - name: Django check and migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lms
        run: |
          python manage.py collectstatic --noinput || true
          python manage.py migrate --noinput
          python manage.py check --deploy --fail-level WARNING || true

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lms
        run: |
          pytest -q || python manage.py test -v

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create dummy .env file for CI
      run: |
        echo "POSTGRES_DB=testdb" > .env
        echo "POSTGRES_USER=testuser" >> .env
        echo "POSTGRES_PASSWORD=testpass" >> .env
        echo "SECRET_KEY=dummy-secret-for-ci" >> .env
        echo "STRIPE_API_KEY=dummy" >> .env
        echo "STRIPE_SECRET_KEY=dummy" >> .env
        echo "EMAIL_HOST_USER=dummy" >> .env
        echo "EMAIL_HOST_PASSWORD=dummy" >> .env

    - name: Build Docker images
      run: docker-compose build

    - name: Run Tests
      run: docker-compose run --rm web python manage.py test

  deploy:
    name: Deploy to Server
    # This job runs only after build_and_test succeeds and only on the main branch
    if: github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main
            docker-compose build
            docker-compose up -d --remove-orphans
            docker-compose exec web python manage.py migrate --noinput
            docker-compose exec web python manage.py collectstatic --noinput
            echo "Deployment successful!"
