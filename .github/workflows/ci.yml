name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create dummy .env file for CI
      run: |
        echo "POSTGRES_DB=testdb" > .env
        echo "POSTGRES_USER=testuser" >> .env
        echo "POSTGRES_PASSWORD=testpass" >> .env
        echo "SECRET_KEY=dummy-secret-for-ci" >> .env
        echo "STRIPE_API_KEY=dummy" >> .env
        echo "STRIPE_SECRET_KEY=dummy" >> .env
        echo "EMAIL_HOST_USER=dummy" >> .env
        echo "EMAIL_HOST_PASSWORD=dummy" >> .env

    - name: Build Docker images
      run: docker-compose build

    - name: Run Tests
      run: docker-compose run --rm web python manage.py test

  deploy:
    name: Deploy to Server
    # This job runs only after build_and_test succeeds and only on the main branch
    if: github.ref == 'refs/heads/main'
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main
            docker-compose build
            docker-compose up -d --remove-orphans
            docker-compose exec web python manage.py migrate --noinput
            docker-compose exec web python manage.py collectstatic --noinput
            echo "Deployment successful!"
